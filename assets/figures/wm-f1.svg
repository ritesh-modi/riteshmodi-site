<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg"><title>A sheet of paper, and the same sheet held against light</title><style>svg{--v9:#FFFCF5;--v10:#F2EADA;--v13:#E4DAC6;--v3:#33302B;--v5:#6F6860;--v4:#767065;--v0:#3F5FA8;--v21:#E2E6F3;--v14:#5C7748;--v15:#E5EADF;--v11:#B1533C;--v12:#F3E4DC;--v20:#94660A;--v2:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;--v1:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;--v7:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect x="60" y="40" width="340" height="220" rx="4" fill="var(--v10)" stroke="var(--v13)" stroke-width="1.5"></rect><rect x="90" y="76" width="240" height="6" rx="3" fill="var(--v13)"></rect><rect x="90" y="104" width="280" height="6" rx="3" fill="var(--v13)"></rect><rect x="90" y="132" width="210" height="6" rx="3" fill="var(--v13)"></rect><rect x="90" y="160" width="264" height="6" rx="3" fill="var(--v13)"></rect><rect x="90" y="188" width="190" height="6" rx="3" fill="var(--v13)"></rect><rect x="90" y="216" width="230" height="6" rx="3" fill="var(--v13)"></rect><text x="60" y="290" fill="var(--v4)" font-family="var(--v7)" font-size="12" text-anchor="start" pointer-events="none">the sheet, flat on a desk</text><line x1="470" y1="40" x2="470" y2="260" stroke="var(--v13)" stroke-width="1.5"></line><text x="500" y="72" fill="var(--v4)" font-family="var(--v7)" font-size="13" text-anchor="start" font-weight="600" pointer-events="none">imperceptible</text><text x="500" y="94" fill="var(--v5)" font-family="var(--v7)" font-size="11" text-anchor="start" pointer-events="none">you handle it daily and never see it</text><text x="500" y="140" fill="var(--v4)" font-family="var(--v7)" font-size="13" text-anchor="start" font-weight="600" pointer-events="none">inseparable</text><text x="500" y="162" fill="var(--v5)" font-family="var(--v7)" font-size="11" text-anchor="start" pointer-events="none">not a layer on top, it is the paper itself</text><text x="500" y="208" fill="var(--v4)" font-family="var(--v7)" font-size="13" text-anchor="start" font-weight="600" pointer-events="none">verifiable</text><text x="500" y="230" fill="var(--v5)" font-family="var(--v7)" font-size="11" text-anchor="start" pointer-events="none">anyone who knows the trick can read it</text></svg>