<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg"><title>A four word vocabulary split into favoured and unfavoured lists</title><style>svg{--v9:#FFFCF5;--v10:#F2EADA;--v13:#E4DAC6;--v3:#33302B;--v5:#6F6860;--v4:#767065;--v0:#3F5FA8;--v21:#E2E6F3;--v14:#5C7748;--v15:#E5EADF;--v11:#B1533C;--v12:#F3E4DC;--v20:#94660A;--v2:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;--v1:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;--v7:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><text x="40" y="28" fill="var(--v4)" font-family="var(--v7)" font-size="12" text-anchor="start" pointer-events="none">LOOK-BACK</text><rect x="40" y="42" width="150" height="40" rx="5" fill="var(--v0)" stroke="var(--v0)" stroke-width="1.5"></rect><text x="115" y="67" fill="var(--v9)" font-family="var(--v7)" font-size="13" text-anchor="middle" font-weight="600" pointer-events="none">sat</text><text x="210" y="58" fill="var(--v5)" font-family="var(--v7)" font-size="12" text-anchor="start" pointer-events="none">letters 40  x7  mod 13</text><text x="210" y="76" fill="var(--v0)" font-family="var(--v7)" font-size="13" text-anchor="start" font-weight="600" pointer-events="none">scrambled number = 7</text><text x="40" y="124" fill="var(--v14)" font-family="var(--v7)" font-size="12" text-anchor="start" pointer-events="none">FAVOURED</text><text x="480" y="124" fill="var(--v11)" font-family="var(--v7)" font-size="12" text-anchor="start" pointer-events="none">NOT FAVOURED</text><rect x="40" y="140" width="300" height="44" rx="5" fill="var(--v15)" stroke="var(--v14)" stroke-width="1.5"></rect><text x="190" y="161" fill="var(--v14)" font-family="var(--v7)" font-size="13" text-anchor="middle" font-weight="600" pointer-events="none">on</text><text x="190" y="177" fill="var(--v4)" font-family="var(--v7)" font-size="11" text-anchor="middle" pointer-events="none">token 1 + 7 = 8, even</text><rect x="480" y="140" width="300" height="44" rx="5" fill="var(--v12)" stroke="var(--v11)" stroke-width="1.5"></rect><text x="630" y="161" fill="var(--v11)" font-family="var(--v7)" font-size="13" text-anchor="middle" font-weight="600" pointer-events="none">down</text><text x="630" y="177" fill="var(--v4)" font-family="var(--v7)" font-size="11" text-anchor="middle" pointer-events="none">token 2 + 7 = 9, odd</text><rect x="40" y="194" width="300" height="44" rx="5" fill="var(--v15)" stroke="var(--v14)" stroke-width="1.5"></rect><text x="190" y="215" fill="var(--v14)" font-family="var(--v7)" font-size="13" text-anchor="middle" font-weight="600" pointer-events="none">quietly</text><text x="190" y="231" fill="var(--v4)" font-family="var(--v7)" font-size="11" text-anchor="middle" pointer-events="none">token 3 + 7 = 10, even</text><rect x="480" y="194" width="300" height="44" rx="5" fill="var(--v12)" stroke="var(--v11)" stroke-width="1.5"></rect><text x="630" y="215" fill="var(--v11)" font-family="var(--v7)" font-size="13" text-anchor="middle" font-weight="600" pointer-events="none">up</text><text x="630" y="231" fill="var(--v4)" font-family="var(--v7)" font-size="11" text-anchor="middle" pointer-events="none">token 4 + 7 = 11, odd</text><line x1="40" y1="300" x2="860" y2="300" stroke="var(--v13)" stroke-width="1"></line><text x="40" y="324" fill="var(--v5)" font-family="var(--v7)" font-size="12" text-anchor="start" pointer-events="none">nothing about the word decides its side. the scrambled number does, and it changes every position.</text></svg>