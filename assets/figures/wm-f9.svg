<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg"><title>Hits against the range chance produces, as passage length grows</title><style>svg{--v9:#FFFCF5;--v10:#F2EADA;--v13:#E4DAC6;--v3:#33302B;--v5:#6F6860;--v4:#767065;--v0:#3F5FA8;--v21:#E2E6F3;--v14:#5C7748;--v15:#E5EADF;--v11:#B1533C;--v12:#F3E4DC;--v20:#94660A;--v2:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;--v1:ui-rounded,-apple-system,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;--v7:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><text x="40" y="28" fill="var(--v4)" font-family="var(--v7)" font-size="12" text-anchor="start" pointer-events="none">OVER 300 POSITIONS</text><rect x="70" y="70" width="760" height="70" rx="3" fill="var(--v10)"></rect><rect x="407" y="70" width="86" height="70" fill="var(--v21)"></rect><line x1="450" y1="62" x2="450" y2="148" stroke="var(--v0)" stroke-width="2"></line><text x="450" y="56" fill="var(--v0)" font-family="var(--v7)" font-size="11" text-anchor="middle" pointer-events="none">chance expects 150</text><text x="70" y="166" fill="var(--v4)" font-family="var(--v7)" font-size="11" text-anchor="start" pointer-events="none">0 hits</text><text x="830" y="166" fill="var(--v4)" font-family="var(--v7)" font-size="11" text-anchor="end" pointer-events="none">300 hits</text><text x="450" y="186" fill="var(--v5)" font-family="var(--v7)" font-size="11" text-anchor="middle" pointer-events="none">where chance alone lands, 95% of the time</text><line x1="579" y1="62" x2="579" y2="148" stroke="var(--v14)" stroke-width="3"></line><text x="579" y="216" fill="var(--v14)" font-family="var(--v7)" font-size="12" text-anchor="middle" font-weight="600" pointer-events="none">watermarked text lands here: 201</text><line x1="40" y1="242" x2="860" y2="242" stroke="var(--v13)" stroke-width="1"></line><text x="40" y="274" fill="var(--v3)" font-family="var(--v7)" font-size="17" text-anchor="start" font-weight="700" pointer-events="none">z = (201 minus 150) / 8.7 = 5.9</text><text x="40" y="308" fill="var(--v14)" font-family="var(--v7)" font-size="14" text-anchor="start" font-weight="600" pointer-events="none">overwhelming. chance does not produce this.</text><text x="40" y="342" fill="var(--v5)" font-family="var(--v7)" font-size="12" text-anchor="start" pointer-events="none">the expectation grows with the number of words, the wobble only with its square root.</text></svg>